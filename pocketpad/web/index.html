<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>PocketPad</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#2a303b; --text:#e8ecf2; --dim:#8b94a3;
          --a:#43c26d; --b:#e5534b; --x:#4c8dff; --y:#f0b429; --accent:#7c5cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
              font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #pad { position:fixed; inset:0; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .abs { position:absolute; }
  .btn { position:absolute; display:flex; align-items:center; justify-content:center; font-weight:700;
         background:var(--panel); border:2px solid var(--line); color:var(--dim); transition:transform .05s, background .05s; }
  .btn.on { transform:scale(.93); background:#2a3140; color:var(--text); border-color:var(--accent); }
  .face { width:15vmin; height:15vmin; border-radius:50%; font-size:6vmin; }
  .face[data-btn=a]{color:var(--a)} .face[data-btn=b]{color:var(--b)}
  .face[data-btn=x]{color:var(--x)} .face[data-btn=y]{color:var(--y)}
  .face.on[data-btn=a]{background:var(--a);color:#06210f} .face.on[data-btn=b]{background:var(--b);color:#2a0805}
  .face.on[data-btn=x]{background:var(--x);color:#04132e} .face.on[data-btn=y]{background:var(--y);color:#2b1f00}
  .shoulder { height:11vmin; width:22vmin; border-radius:3vmin; font-size:4vmin; }
  .small { height:7vmin; min-width:12vmin; padding:0 2vmin; border-radius:4vmin; font-size:2.8vmin; }
  .dpad { width:12vmin; height:12vmin; font-size:5vmin; border-radius:2.5vmin; }
  .stick { width:34vmin; height:34vmin; border-radius:50%; background:radial-gradient(circle,#1c212b 0%,#12161d 70%); border:2px solid var(--line); }
  .stick .knob { position:absolute; left:50%; top:50%; width:15vmin; height:15vmin; margin:-7.5vmin 0 0 -7.5vmin; border-radius:50%;
                 background:linear-gradient(145deg,#39404f,#252a35); border:2px solid #4a5263; box-shadow:0 .8vmin 2vmin #0008; pointer-events:none; }
  .stick.on { border-color:var(--accent); }
  #bar { position:absolute; top:calc(env(safe-area-inset-top) + 1vmin); left:50%; transform:translateX(-50%); display:flex; gap:2vmin; align-items:center; z-index:5; }
  #status { font-size:2.6vmin; color:var(--dim); display:flex; gap:1vmin; align-items:center; }
  #dot { width:2vmin; height:2vmin; border-radius:50%; background:var(--b); }
  #dot.ok { background:var(--a); }
  #fs { font-size:2.6vmin; padding:.8vmin 2vmin; border-radius:3vmin; border:1px solid var(--line); background:var(--panel); color:var(--dim); }
  #rotate { display:none; position:fixed; inset:0; background:var(--bg); z-index:10; align-items:center; justify-content:center; text-align:center; padding:8vw; font-size:5vw; color:var(--dim); }
  @media (orientation:portrait) { #rotate { display:flex; } }
  #nokey { display:none; position:fixed; inset:0; z-index:11; background:var(--bg); align-items:center; justify-content:center; text-align:center; padding:8vw; color:var(--dim); font-size:4vmin; }
</style>
</head>
<body>
<div id="rotate">Tournez votre téléphone en mode paysage ↻</div>
<div id="nokey">Lien incomplet : scannez le QR code ou copiez le lien affiché par PocketPad sur le PC (il contient la clé d’appairage).</div>
<div id="pad">
  <div id="bar"><div id="status"><span id="dot"></span><span id="stxt">connexion…</span></div><button id="fs" class="btn" style="position:static;height:auto;border-radius:3vmin">Plein écran</button></div>

  <div class="btn shoulder" data-btn="lb" style="left:4vmin;top:5vmin">LB</div>
  <div class="btn shoulder" data-trig="lt" style="left:28vmin;top:5vmin">LT</div>
  <div class="btn shoulder" data-btn="rb" style="right:4vmin;top:5vmin">RB</div>
  <div class="btn shoulder" data-trig="rt" style="right:28vmin;top:5vmin">RT</div>

  <div class="abs stick" id="ls" data-stick="l" style="left:6vmin;top:20vmin"><div class="knob"></div></div>
  <div class="abs stick" id="rs" data-stick="r" style="right:22vmin;bottom:4vmin"><div class="knob"></div></div>

  <div class="btn dpad" data-btn="up" style="left:44vmin;bottom:22vmin">▲</div>
  <div class="btn dpad" data-btn="left" style="left:31vmin;bottom:10vmin">◀</div>
  <div class="btn dpad" data-btn="right" style="left:57vmin;bottom:10vmin">▶</div>
  <div class="btn dpad" data-btn="down" style="left:44vmin;bottom:4vmin">▼</div>

  <div class="btn small" data-btn="back" style="left:calc(50% - 22vmin);top:calc(50% - 6vmin)">Back</div>
  <div class="btn small" data-btn="guide" style="left:calc(50% - 6vmin);top:calc(50% - 6vmin)">◎</div>
  <div class="btn small" data-btn="start" style="left:calc(50% + 10vmin);top:calc(50% - 6vmin)">Start</div>

  <div class="btn face" data-btn="y" style="right:22vmin;top:22vmin">Y</div>
  <div class="btn face" data-btn="x" style="right:37vmin;top:36vmin">X</div>
  <div class="btn face" data-btn="b" style="right:7vmin;top:36vmin">B</div>
  <div class="btn face" data-btn="a" style="right:22vmin;top:50vmin">A</div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const key = q.get("key"), room = q.get("room");
  if (!key) { document.getElementById("nokey").style.display = "flex"; return; }
  const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host +
                (room ? "/ws/" + encodeURIComponent(room) : "/ws") + "?key=" + encodeURIComponent(key);

  const state = { b: new Set(), lx:0, ly:0, rx:0, ry:0, lt:0, rt:0 };
  let ws, dirty = false, lastSent = "";
  const dot = document.getElementById("dot"), stxt = document.getElementById("stxt");
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

  function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { dot.className = "ok"; stxt.textContent = "connecté"; dirty = true; };
    ws.onclose = () => { dot.className = ""; stxt.textContent = "reconnexion…"; setTimeout(connect, 1000); };
    ws.onerror = () => ws.close();
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === "pong") stxt.textContent = "connecté · " + Math.round(performance.now() - m.ts) + " ms";
      else if (m.t === "rumble") { const s = Math.max(m.l, m.s); if (s > 0) buzz(Math.round(20 + 60 * s)); else try { navigator.vibrate(0); } catch(e){} }
    };
  }
  connect();
  setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ t:"ping", ts: performance.now() })); }, 2000);

  function flush() {
    if (dirty && ws && ws.readyState === 1) {
      const msg = JSON.stringify({ t:"s", b:[...state.b], lx:+state.lx.toFixed(3), ly:+state.ly.toFixed(3),
        rx:+state.rx.toFixed(3), ry:+state.ry.toFixed(3), lt:state.lt, rt:state.rt });
      if (msg !== lastSent) { ws.send(msg); lastSent = msg; }
      dirty = false;
    }
    requestAnimationFrame(flush);
  }
  requestAnimationFrame(flush);
  // renvoi periodique : evite les etats perdus sur reseau instable
  setInterval(() => { lastSent = ""; dirty = true; }, 500);

  // boutons et gachettes
  document.querySelectorAll("[data-btn],[data-trig]").forEach(el => {
    const press = on => {
      el.classList.toggle("on", on);
      if (el.dataset.btn) on ? state.b.add(el.dataset.btn) : state.b.delete(el.dataset.btn);
      else state[el.dataset.trig] = on ? 1 : 0;
      if (on) buzz(8);
      dirty = true;
    };
    el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); press(true); });
    ["pointerup","pointercancel","lostpointercapture"].forEach(t => el.addEventListener(t, () => press(false)));
  });

  // sticks analogiques
  document.querySelectorAll("[data-stick]").forEach(el => {
    const knob = el.querySelector(".knob"), side = el.dataset.stick;
    let id = null;
    const move = e => {
      const r = el.getBoundingClientRect(), R = r.width / 2;
      let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
      const d = Math.hypot(dx, dy), max = R * 0.8;
      if (d > max) { dx *= max / d; dy *= max / d; }
      knob.style.transform = `translate(${dx}px,${dy}px)`;
      state[side + "x"] = dx / max; state[side + "y"] = -dy / max; dirty = true;
    };
    const end = () => { id = null; el.classList.remove("on"); knob.style.transform = ""; state[side+"x"] = 0; state[side+"y"] = 0; dirty = true; };
    el.addEventListener("pointerdown", e => { if (id !== null) return; id = e.pointerId; el.setPointerCapture(id); el.classList.add("on"); move(e); });
    el.addEventListener("pointermove", e => { if (e.pointerId === id) move(e); });
    ["pointerup","pointercancel"].forEach(t => el.addEventListener(t, e => { if (e.pointerId === id) end(); }));
  });

  // plein ecran + ecran toujours allume
  document.getElementById("fs").addEventListener("click", () => {
    const d = document.documentElement;
    (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d);
    try { screen.orientation.lock("landscape"); } catch(e){}
  });
  let lock; const wake = async () => { try { lock = await navigator.wakeLock.request("screen"); } catch(e){} };
  wake(); document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wake());
  document.addEventListener("contextmenu", e => e.preventDefault());
})();
</script>
</body>
</html>
