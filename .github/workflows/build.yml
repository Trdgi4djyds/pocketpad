name: Build PocketPad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface web + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vérification TypeScript
        run: pnpm exec tsc --noEmit
      - name: Compilation des deux applications (APK et logiciel PC)
        run: pnpm build:apps
      - name: Auto-test du serveur du Hub
        working-directory: desktop
        run: |
          npm install --no-save --no-package-lock --ignore-scripts ws@8
          node scripts/selftest.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: out

  android:
    name: Application Android (APK)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: apps
          path: out
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: SDK Android (préinstallé sur le runner GitHub)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: pnpm exec cap sync android
      - name: Compilation Gradle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PocketPad-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: PocketPad-Android.apk

  windows:
    name: Logiciel PC (Windows)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: apps
          path: desktop/app
      - name: Dépendances (dont le module natif ViGEm)
        working-directory: desktop
        run: npm install
      - name: Vérifie le module ViGEm
        working-directory: desktop
        run: node -e "require('vigemclient'); console.log('vigemclient OK')"
      - name: Outils embarqués (ADB + pilote ViGEmBus)
        shell: pwsh
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath vendor -Force
          Remove-Item pt.zip
          Invoke-WebRequest https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe -OutFile vendor/ViGEmBus_Setup.exe
          Get-ChildItem vendor
      - name: Auto-test du serveur
        working-directory: desktop
        env:
          STATIC_DIR: app
        run: node scripts/selftest.cjs
      - name: Installateur et version portable
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/release/*.exe

  release:
    name: Publication
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - name: Release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk out/*.exe \
            --target "${{ github.sha }}" \
            --title "PocketPad — dernière version" \
            --notes-file .github/RELEASE_NOTES.md
